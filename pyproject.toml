[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-compression-suite"
version = "1.0.0"
description = "End-to-end PyTorch framework for Knowledge Distillation, Iterative Magnitude Pruning, and Post-Training Quantization with Pareto profiling."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Model Compression Suite Contributors" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "tqdm>=4.64.0",
]

[project.scripts]
compression-suite = "compression_suite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
